<html>
  <head>
    <title>Voice Lab</title>
    <script type="module">
      import { store } from "/components/settings/speech/voice-lab-store.js";
      console.log("voice-lab-store.js loaded", store);
    </script>
  </head>
  <body>
    <div x-data x-init="$store.voiceLab && $store.voiceLab.init()">
      <template x-if="$store.voiceLab">
        <div class="voice-lab">
          <div class="voice-lab__errors" x-show="$store.voiceLab.error">
            <span class="error" x-text="$store.voiceLab.error"></span>
          </div>

          <!-- Recording Interface -->
          <div class="voice-recording" x-show="!$store.voiceLab.showRecording && !$store.voiceLab.loading">
            <button type="button" class="btn btn-primary btn-large" @click="$store.voiceLab.showRecordingScreen()">
              🎙️ Record New Voice
            </button>
          </div>

          <div class="recording-screen" x-show="$store.voiceLab.showRecording">
            <div class="recording-header">
              <h3>🎙️ Record Your Voice</h3>
              <button type="button" class="btn btn-secondary" @click="$store.voiceLab.hideRecordingScreen()">Cancel</button>
            </div>

            <div class="script-section">
              <h4>📖 Read this script:</h4>
              <div class="script-text">
                "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs."
              </div>
              <p class="script-hint">Speak clearly and naturally. This should take about 5-7 seconds.</p>
            </div>

            <div class="recording-controls">
              <div class="recording-status" x-show="!$store.voiceLab.recording">
                <span class="status-indicator">🔴 Ready to record</span>
                <button type="button" class="btn btn-primary btn-large" @click="$store.voiceLab.startRecording()">
                  🎙️ Start Recording
                </button>
              </div>

              <div class="recording-active" x-show="$store.voiceLab.recording">
                <div class="recording-indicator">
                  <span class="recording-dot"></span>
                  <span class="recording-timer" x-text="$store.voiceLab.formattedDuration"></span>
                </div>
                <button type="button" class="btn btn-danger btn-large" @click="$store.voiceLab.stopRecording()">
                  ⏹️ Stop Recording
                </button>
              </div>

              <div class="recording-preview" x-show="$store.voiceLab.audioURL && !$store.voiceLab.recording">
                <div class="preview-controls">
                  <audio controls :src="$store.voiceLab.audioURL" class="preview-audio"></audio>
                  <div class="preview-actions">
                    <button type="button" class="btn btn-field" @click="$store.voiceLab.playRecording()">
                      ▶️ Play
                    </button>
                    <button type="button" class="btn btn-secondary" @click="$store.voiceLab.resetRecording()">
                      🔄 Start Over
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="recording-form" x-show="$store.voiceLab.audioURL && !$store.voiceLab.recording">
              <fieldset class="voice-lab__form">
                <label>
                  <span>Voice Name</span>
                  <input type="text" x-model="$store.voiceLab.nameInput" placeholder="My Voice" />
                </label>
                <label>
                  <span>Reference Text (what you just read)</span>
                  <textarea x-model="$store.voiceLab.refTextInput" rows="2" placeholder="The quick brown fox jumps over the lazy dog..."></textarea>
                </label>
                <button type="button" class="btn btn-primary" @click="$store.voiceLab.registerVoice()">
                  💾 Save Voice
                </button>
              </fieldset>
            </div>
          </div>

          <!-- Legacy File Upload (fallback) -->
          <div class="voice-upload" x-show="!$store.voiceLab.showRecording && !$store.voiceLab.loading">
            <p class="upload-hint">Or upload a WAV file (3-15 seconds):</p>
            <input type="file" accept="audio/wav" @change="$store.voiceLab.setFile($event.target.files[0])" />
          </div>

          <section class="voice-lab__voices">
            <header class="voice-lab__voices-header">
              <h3>Voice Library</h3>
              <div class="actions">
                <button class="btn btn-field" :disabled="$store.voiceLab.loading" @click="$store.voiceLab.refresh()">Refresh</button>
                <button class="btn btn-danger" :disabled="$store.voiceLab.loading" @click="$store.voiceLab.resetVoices()">Reset Voices</button>
              </div>
            </header>
            <template x-if="$store.voiceLab.voices.length === 0">
              <p class="muted">No custom voices yet. Upload a reference clip to create one.</p>
            </template>
            <template x-for="voice in $store.voiceLab.voices" :key="voice.id">
              <div class="voice-card">
                <div class="voice-card__info">
                  <strong x-text="voice.name"></strong>
                  <span class="voice-card__meta">
                    ID: <code x-text="voice.id"></code>
                    <template x-if="$store.voiceLab.defaultVoiceId === voice.id">
                      <span class="badge">Default</span>
                    </template>
                  </span>
                  <span class="voice-card__timestamp" x-text="new Date((voice.created_at || Date.now()/1000) * 1000).toLocaleString()"></span>
                </div>
                <div class="voice-card__actions">
                  <button class="btn btn-field" :disabled="$store.voiceLab.loading" @click="$store.voiceLab.previewVoice(voice)">Preview</button>
                  <button class="btn btn-field" :disabled="$store.voiceLab.loading || $store.voiceLab.defaultVoiceId === voice.id" @click="$store.voiceLab.setDefaultVoice(voice.id)">Set Default</button>
                  <button class="btn btn-danger" :disabled="$store.voiceLab.loading" @click="$store.voiceLab.deleteVoice(voice.id)">Delete</button>
                </div>
              </div>
            </template>
          </section>
        </div>
      </template>
    </div>

    <style>
      .voice-lab {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      fieldset.voice-lab__form {
        border: 1px solid var(--border-subtle, #ddd);
        padding: 1rem;
        border-radius: 0.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0.75rem;
      }
      fieldset.voice-lab__form label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      fieldset.voice-lab__form input,
      fieldset.voice-lab__form textarea {
        border: 1px solid var(--border-subtle, #ccc);
        border-radius: 0.375rem;
        padding: 0.5rem;
        font-size: 0.95rem;
      }
      .voice-lab__voices-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .voice-card {
        border: 1px solid var(--border-subtle, #ddd);
        border-radius: 0.5rem;
        padding: 0.75rem;
        margin-top: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .voice-card__info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .voice-card__meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        color: var(--text-subtle, #666);
      }
      .voice-card__actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .badge {
        background: var(--accent, #2563eb);
        color: #fff;
        padding: 0.1rem 0.5rem;
        border-radius: 9999px;
        font-size: 0.75rem;
      }
      .muted {
        color: var(--text-subtle, #666);
        font-style: italic;
      }
      .voice-lab__errors .error {
        color: var(--danger, #c53030);
      }
      
      /* Recording Interface Styles */
      .voice-recording {
        text-align: center;
        padding: 2rem 0;
      }
      .btn-large {
        padding: 1rem 2rem;
        font-size: 1.1rem;
        min-width: 200px;
      }
      
      .recording-screen {
        border: 1px solid var(--border-subtle, #ddd);
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 1rem;
        background: var(--background, #fff);
      }
      .recording-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-subtle, #eee);
      }
      .recording-header h3 {
        margin: 0;
        color: var(--text, #333);
      }
      
      .script-section {
        background: var(--background-subtle, #f8f9fa);
        padding: 1rem;
        border-radius: 0.375rem;
        margin-bottom: 1.5rem;
      }
      .script-section h4 {
        margin: 0 0 0.5rem 0;
        color: var(--text, #333);
      }
      .script-text {
        background: var(--background, #fff);
        padding: 1rem;
        border-left: 4px solid var(--accent, #2563eb);
        border-radius: 0.25rem;
        font-family: monospace;
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 0.75rem;
      }
      .script-hint {
        margin: 0;
        color: var(--text-subtle, #666);
        font-style: italic;
        font-size: 0.9rem;
      }
      
      .recording-controls {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .recording-status, .recording-active, .recording-preview {
        margin-bottom: 1rem;
      }
      .status-indicator {
        display: block;
        margin-bottom: 1rem;
        font-weight: 500;
      }
      
      .recording-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        gap: 0.5rem;
      }
      .recording-dot {
        width: 12px;
        height: 12px;
        background: #dc3545;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
      .recording-timer {
        font-family: monospace;
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--danger, #dc3545);
      }
      
      .preview-controls {
        text-align: center;
      }
      .preview-audio {
        width: 100%;
        max-width: 400px;
        margin-bottom: 1rem;
      }
      .preview-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .recording-form {
        border-top: 1px solid var(--border-subtle, #eee);
        padding-top: 1rem;
        margin-top: 1rem;
      }
      
      .voice-upload {
        text-align: center;
        padding: 1rem;
        border-top: 1px solid var(--border-subtle, #eee);
        margin-top: 1rem;
      }
      .upload-hint {
        margin: 0;
        color: var(--text-subtle, #666);
        font-size: 0.9rem;
      }
    </style>
  </body>
</html>
